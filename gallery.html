<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#005EA6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#001830" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Café Aroma">
    <meta name="format-detection" content="telephone=no">
    <meta name="description"
        content="A visual escape to Café Aroma. Stunning views of Santorini-inspired decor and authentic Greek dishes.">
    <link rel="canonical" href="https://cafearoma.com/gallery.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Café Aroma Santorini">
    <meta property="og:url" content="https://cafearoma.com/gallery.html">
    <meta property="og:title" content="Visual Gallery | Café Aroma">
    <meta property="og:description" content="A visual escape to Café Aroma. Stunning views of Santorini-inspired decor and authentic Greek dishes.">
    <meta property="og:image" content="/coffee_item.png">
    <meta name="twitter:card" content="summary_large_image">
    <title>Visual Gallery | Café Aroma 🐚📸</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="container">
            <!-- Dynamic Header Injected by main.js -->
        </div>
    </header>

    <main>
        <section class="section subpage-header reveal">
            <div class="container">
                <span class="subtitle">A Visual Journey</span>
                <h1>Views of <span style="color: var(--soft-gold); font-style: italic;">Santorini</span></h1>
                <p>Explore a curated selection of our favourite moments—from hand-poured espressos to sun-drenched island light.</p>
            </div>
        </section>

        <section class="section reveal" style="background-color: #FAF8F5; padding-top: 3.5rem; padding-bottom: 6rem;">
            <div class="container">
                <div class="gallery-grid">
                    <div class="reveal gallery-item">
                        <img src="/coffee_item.png" alt="Signature Greek Coffee" loading="lazy" decoding="async">
                        <div class="gallery-overlay">
                            <span class="gallery-caption">Signature Freddo Espresso</span>
                        </div>
                    </div>
                    <div class="reveal gallery-item">
                        <img src="/food_item.png" alt="Traditional Aegean Pasta" loading="lazy" decoding="async">
                        <div class="gallery-overlay">
                            <span class="gallery-caption">Traditional Aegean Pasta</span>
                        </div>
                    </div>
                    <div class="reveal gallery-item">
                        <img src="/dessert_item.png" alt="Honey Baklava" loading="lazy" decoding="async">
                        <div class="gallery-overlay">
                            <span class="gallery-caption">Honey Filo Baklava</span>
                        </div>
                    </div>
                    <div class="reveal gallery-item">
                        <img src="/src/assets/hero_bg.png" alt="Santorini Atmosphere" loading="lazy" decoding="async">
                        <div class="gallery-overlay">
                            <span class="gallery-caption">Santorini Terrace View</span>
                        </div>
                    </div>
                    <div class="reveal gallery-item">
                        <img src="/src/assets/about_roaster.png" alt="Master Roaster at Work" loading="lazy" decoding="async">
                        <div class="gallery-overlay">
                            <span class="gallery-caption">Master Roaster at Work</span>
                        </div>
                    </div>
                    <div class="reveal gallery-item">
                        <img src="/food_item.png" alt="Classic Greek Salad" loading="lazy" decoding="async">
                        <div class="gallery-overlay">
                            <span class="gallery-caption">Classic Greek Mezze</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <!-- Dynamic Footer Injected by main.js -->
        </div>
    </footer>

    <script type="module" src="/main.js"></script>
</body>

</html>
