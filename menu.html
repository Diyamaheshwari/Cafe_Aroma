<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#005EA6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#001830" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Café Aroma">
    <meta name="format-detection" content="telephone=no">
    <meta name="description"
        content="Explore the full menu at Café Aroma. From signature Greek espresso and Freddos to authentic Mediterranean pastries and dishes.">
    <link rel="canonical" href="https://cafearoma.com/menu.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Café Aroma Santorini">
    <meta property="og:url" content="https://cafearoma.com/menu.html">
    <meta property="og:title" content="The Full Menu | Café Aroma">
    <meta property="og:description" content="Explore the full menu at Café Aroma. From signature Greek espresso and Freddos to authentic Mediterranean pastries and dishes.">
    <meta property="og:image" content="/food_item.png">
    <meta name="twitter:card" content="summary_large_image">
    <title>The Full Menu | Café Aroma ☕🌊</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="container">
            <!-- Dynamic Header Injected by main.js -->
        </div>
    </header>

    <main>
        <section class="section subpage-header reveal">
            <div class="container">
                <span class="subtitle">Taste the Aegean</span>
                <h1>Experience Our <span style="color: var(--soft-gold); font-style: italic;">Menu</span></h1>
                <p>Authentic Greek flavours, handcrafted with love and tradition.</p>

                <div class="menu-search-container reveal"
                    style="margin-top: 2rem; max-width: 600px; margin-left: auto; margin-right: auto; position: relative;">
                    <span class="search-icon" style="color: var(--aegean-blue);">🔍</span>
                    <input type="text" class="menu-search-input" placeholder="Search for your favorite dish or drink..."
                        style="padding: 1rem 1rem 1rem 3.5rem; border-radius: 50px; font-size: 1rem; border: none; box-shadow: 0 15px 40px rgba(0,0,0,0.3); width: 100%; background: white;">
                </div>

                <div class="menu-tabs reveal"
                    style="margin-top: 2rem; display: flex; justify-content: center; gap: clamp(0.5rem, 1.5vw, 1rem); flex-wrap: wrap;">
                    <button class="tab-btn active">Coffee</button>
                    <button class="tab-btn">Beverages</button>
                    <button class="tab-btn">Food</button>
                    <button class="tab-btn">Desserts</button>
                    <button class="tab-btn">All</button>
                </div>
            </div>
        </section>

        <section class="section reveal" id="menu-section"
            style="background-color: #FAF8F5; padding-top: 3.5rem; padding-bottom: 6rem;">
            <div class="container">
                <div id="menu-content">
                    <!-- Dynamic Menu Grid Injected by main.js -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <!-- Dynamic Footer Injected by main.js -->
        </div>
    </footer>

    <script type="module" src="/main.js"></script>
</body>

</html>
